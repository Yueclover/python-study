          text: '# 任务

            根据给定的「审查结果」，判断原文是否存在格式或内容错误。


            # 判断标准

            - 只要审查结果中指出了任意一处「格式错误」或「内容错误」，即视为存在错误。

            - 格式错误：如标点、排版、空格、编号、大小写、字体样式等不规范。

            - 内容错误：如错别字、语义错误、事实错误、逻辑矛盾、信息缺失或冗余等。

            - 若审查结果未发现任何问题，或仅为正向/无问题的描述，则视为不存在错误。


            # 输出要求

            - 存在错误，输出：yes

            - 不存在错误，输出：no

            - 只允许输出 yes 或 no 这一个单词，禁止输出任何解释、标点、引号或多余文字。


            # 审查结果

            {{#1779958004956_dr1.result#}}

            '
