          \        doc_id = pj.get(\"doc_id\", \"\")\n        sk = pj.get(\"skeleton\"\
          , {\"slides\": []})\n        if not isinstance(sk, dict):\n            sk\
          \ = {\"slides\": []}\n        skeleton = json.dumps(sk, ensure_ascii=False)\n\
          \        pages = json.dumps(\n            [{\"slide_id\": s[\"slide_id\"\
          ], \"role\": s[\"role\"]}\n             for s in sk.get(\"slides\", [])],\
