    - data:
        code: "import json\ndef main(history: str, intent: str) -> dict:\n    def\
          \ _last_writing(h):\n        try:\n            arr = json.loads(h) if (h\
          \ or '').strip() else []\n        except Exception:\n            arr = []\n\
          \        if not isinstance(arr, list):\n            return ''\n        for\
          \ m in reversed(arr):\n            if isinstance(m, dict) and m.get('role')\
          \ == 'assistant':\n                c = m.get('content', '')\n          \
          \      if isinstance(c, str) and c.strip():\n                    return\
          \ c\n        return ''\n    content = _last_writing(history)\n    t=(intent\
          \ or '').strip()\n    if t.startswith('```'):\n        t=t.strip('`')\n\
          \        if t[:4]=='json': t=t[4:]\n        t=t.strip()\n    try: info=json.loads(t)\n\
          \    except Exception:\n        s=t.find('{'); e=t.rfind('}')\n        info=json.loads(t[s:e+1])\
          \ if s!=-1 and e!=-1 else {}\n    op=info.get('operation','rewrite')\n \
          \   inst=info.get('instruction','')\n    need='true' if not (content or\
          \ '').strip() else 'false'\n    return {'operation':op,'instruction':inst,'full_text':content\
          \ or '','need_clarify':need}\n"
