    - data:
        code: "def main(query: str, files: list, chathistory: str) -> dict:\n    parts\
          \ = []\n\n    # 历史对话（可选，为空则跳过）\n    if chathistory and chathistory.strip():\n\
          \        parts.append(\"# 历史对话（用于理解上下文和指代，不必直接提取关键词）\\n\" + chathistory.strip())\n\
          \n    # 参考文件（可选，为空则跳过）\n    if files:\n        file_texts = []\n       \
          \ for f in files:\n            if not isinstance(f, dict):\n           \
          \     continue\n            name = (f.get(\"file_name\") or \"\").strip()\n\
          \            content = (f.get(\"file_content\") or \"\").strip()\n     \
          \       if content:\n                file_texts.append((name + \"\\n\" +\
          \ content).strip() if name else content)\n            elif name:\n     \
          \           file_texts.append(name)\n        if file_texts:\n          \
          \  parts.append(\"# 参考文件（用于补充背景，仅在与问题相关时参考）\\n\" + \"\\n\\n\".join(file_texts))\n\
          \n    # 当前用户问题（必填，放最后）\n    parts.append(\"# 当前用户问题（关键词主要来源）\\n\" + (query\
          \ or \"\").strip())\n\n    prompt = \"\\n\\n\".join(parts)\n    return {\"\
          prompt\": prompt}"
