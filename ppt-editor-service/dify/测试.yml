        instruction: '判断用户的写作需求属于「短文」「长文」还是「按大纲写作」。

          判断规则：

          1. outline（按大纲写作）：用户在本轮需求或历史对话中已经明确提供了自己的大纲/提纲/目录/章节结构（例如包含一、二、三或 1. 2.
          3. 或多级标题、分点的成型结构），希望据此成文时，一律归为 outline，优先级最高；

          2. 若用户需求中明确写了「短文」或「长文」，按需求输出；

          3. 否则按内容复杂度判断：

          - short（短文）：预期 ≤1500 字，例如文案、微博、短评、公告、邮件、产品介绍；

          - long（长文）：预期 >1500 字，结构化分章节内容，例如深度分析、研究报告、白皮书、长篇博客。

