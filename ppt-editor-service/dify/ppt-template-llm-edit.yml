        - id: 1e1a66f6-05b0-4908-9f38-fee9392ff15b
          role: system
          text: "你是PPT结构规划师。根据大纲和模板页面清单，规划要产出的每一页。\n只输出 JSON，含 outline 数组，不要解释、不要代码块包裹。\n\
            规则：\n1. outline 每项 = {\"use_slide_id\":\"<模板页slide_id>\",\"role\":\"<该页role>\"\
            ,\"brief\":\"这页要写的内容要点\"}。\n2. 不要改变页面顺序；正文等可重复页要几页就重复列几项（use_slide_id\
            \ 相同）。\n3. role 取自页面清单里出现过的值（cover/toc/section/content/table/ending/generic）。\n\
            4. brief 要具体、可直接据此写文案；正文每项 2-3 句、有数据感。\n5. 正文页数与篇幅档位匹配：short≈8页、normal≈14页、long≈20页（空值按\
            \ normal）；该计数不含封面/目录/过渡/结尾页。\n输出示例：\n{\"outline\":[\n  {\"use_slide_id\"\
            :\"s1\",\"role\":\"cover\",\"brief\":\"主标题:2026产品发布；副标题:让服务快人一步\"},\n\
            \  {\"use_slide_id\":\"s2\",\"role\":\"toc\",\"brief\":\"目录4项:背景/方案/数据/计划\"\
            },\n  {\"use_slide_id\":\"s5\",\"role\":\"content\",\"brief\":\"背景:市场规模...\"\
            },\n  {\"use_slide_id\":\"s5\",\"role\":\"content\",\"brief\":\"方案:三步走...\"\
            }\n]}\n"
        - id: b0c8e545-ec42-433f-a05c-0bb14efdfa0e
          role: user
          text: '模板页面清单（slide_id 与 role）：

            {{#code_extract.pages#}}


            大纲：

            {{#17817757512960.text#}}


            篇幅档位：{{#start.content_length#}}


            请只输出 outline 的 JSON。

            '
        selected: false
        title: 大纲规划
        type: llm
        vision:
          enabled: false
      height: 87
      id: llm_a
      position:
        x: 1026
        y: 82.83333333333334
      positionAbsolute:
        x: 1026
        y: 82.83333333333334
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "def main(outline_text: str, skeleton: str) -> dict:\n    import json,\
          \ re\n    outline = []\n    m = re.search(r\"\\{.*\\}\", outline_text or\
          \ \"\", re.S)\n    if m:\n        try:\n            outline = json.loads(m.group(0)).get(\"\
          outline\", [])\n        except Exception:\n            outline = []\n  \
          \  slots_by_slide = {}\n    try:\n        sk = json.loads(skeleton)\n  \
          \      if not isinstance(sk, dict):\n            sk = {\"slides\": []}\n\
          \        for s in sk.get(\"slides\", []):\n            slots_by_slide[s[\"\
          slide_id\"]] = [\n                sl for sl in s.get(\"slots\", []) if sl.get(\"\
          editable\")]\n    except Exception:\n        pass\n    # kept_ids: all outline-referenced\
          \ slide_ids that exist in skeleton\n    # (regardless of whether they have\
          \ editable slots)\n    seen_kept = set()\n    kept_ids = []\n    for it\
          \ in outline:\n        sid = it.get(\"use_slide_id\")\n        if sid in\
          \ slots_by_slide and sid not in seen_kept:\n            seen_kept.add(sid)\n\
          \            kept_ids.append(sid)\n    tasks = []\n    for it in outline:\n\
          \        sid = it.get(\"use_slide_id\")\n        if sid not in slots_by_slide:\n\
          \            continue\n        # skip LLM call for slides with no editable\
          \ slots, but keep in kept_ids\n        if not slots_by_slide[sid]:\n   \
          \         continue\n        tasks.append({\n            \"slide_id\": sid,\n\
          \            \"role\": it.get(\"role\", \"\"),\n            \"brief\": it.get(\"\
          brief\", \"\"),\n            \"slots\": slots_by_slide[sid],\n        })\n\
          \    return {\"tasks\": json.dumps(tasks, ensure_ascii=False),\n       \
          \     \"count\": len(tasks),\n            \"kept_ids\": json.dumps(kept_ids,\
          \ ensure_ascii=False)}\n"
        code_language: python3
        outputs:
          count:
            type: number
          kept_ids:
            type: string
          tasks:
            type: string
        selected: false
        title: 合并大纲与骨架
        type: code
        variables:
        - value_selector:
          - llm_a
          - text
          variable: outline_text
        - value_selector:
          - code_extract
          - skeleton
          variable: skeleton
