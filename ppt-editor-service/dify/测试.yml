    - data:
        code: "import json\n\n\ndef main(v0: str, v1: str, v2: str, user_query: str,\
          \ history: str) -> dict:\n    # 两段回答各自做一次 format（保留你原逻辑：替换文本里的 {xxx} 占位符）\n\
          \    reply0 = \"\"\"{v0}\"\"\".format(v0=v0)\n    reply1 = \"\"\"{v1}\"\"\
          \".format(v1=v1)\n    reply2 = \"\"\"{v2}\"\"\".format(v2=v2)\n\n    reply\
          \ = \"审核结果：\" + reply0 + \"\\n审核报告：\\n\" + reply1 + \"\\n修正后内容：\\n\"  +\
          \ reply2\n\n    # 反序列化历史 JSON，做好容错：空字符串 / 非法 JSON / 非数组 都退化成空列表\n    try:\n\
          \        arr = json.loads(history) if (history or '').strip() else []\n\
          \        if not isinstance(arr, list):\n            arr = []\n    except\
          \ Exception:\n        arr = []\n\n    # 追加本轮对话：user 一条，assistant 一条\n  \
          \  arr.append({\"role\": \"user\", \"content\": user_query})\n    arr.append({\"\
          role\": \"assistant\", \"content\": reply})\n\n    # 序列化输出，ensure_ascii=False\
          \ 保证中文不被转义成 \\uXXXX\n    return {\"messages_json\": json.dumps(arr, ensure_ascii=False)}\n"
        code_language: python3
