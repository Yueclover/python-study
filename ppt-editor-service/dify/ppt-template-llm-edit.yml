app:
  description: 上传 PPT 模板 → LLM 生成编辑指令 → 回写新 pptx 下载
  icon: 📊
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: PPT模板LLM编辑
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: package
  value:
    plugin_unique_identifier: wxj/bifrost:0.1.5@b3a12d4350183a23b02da9cd95280287fa3459e6989d74b4330dbb11b0ef32cc
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: ''
    id: env-svc-0001
    name: SVC
    selector:
    - env
    - SVC
    value: http://172.16.40.114:8000
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - {id: e1, source: start, sourceHandle: source, target: http_parse, targetHandle: target, type: custom, data: {sourceType: start, targetType: http-request, isInIteration: false}}
    - {id: e2, source: http_parse, sourceHandle: source, target: code_extract, targetHandle: target, type: custom, data: {sourceType: http-request, targetType: code, isInIteration: false}}
    - {id: e3, source: code_extract, sourceHandle: source, target: llm_a, targetHandle: target, type: custom, data: {sourceType: code, targetType: llm, isInIteration: false}}
    - {id: e4, source: llm_a, sourceHandle: source, target: code_join, targetHandle: target, type: custom, data: {sourceType: llm, targetType: code, isInIteration: false}}
    - {id: e5, source: code_join, sourceHandle: source, target: iteration, targetHandle: target, type: custom, data: {sourceType: code, targetType: iteration, isInIteration: false}}
    - {id: e6, source: iteration, sourceHandle: source, target: code_assemble, targetHandle: target, type: custom, data: {sourceType: iteration, targetType: code, isInIteration: false}}
    - {id: e7, source: code_assemble, sourceHandle: source, target: http_apply_plan, targetHandle: target, type: custom, data: {sourceType: code, targetType: http-request, isInIteration: false}}
    - {id: e8, source: http_apply_plan, sourceHandle: source, target: end, targetHandle: target, type: custom, data: {sourceType: http-request, targetType: end, isInIteration: false}}
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - allowed_file_extensions:
          - .pptx
          allowed_file_types:
          - document
          allowed_file_upload_methods:
          - local_file
          - remote_url
          label: PPT模板
          options: []
          required: true
          type: file
          variable: file
        - label: 用户需求
          max_length: 2000
          options: []
          required: true
          type: paragraph
          variable: user_brief
      height: 116
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - file:
            - start
            - file
            id: parse-file-item
            key: file
            type: file
            value: ''
          type: form-data
        desc: POST /parse，上传 pptx 取结构化 JSON
        headers: ''
        method: post
        params: ''
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 100
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        title: 解析PPT
        type: http-request
        url: '{{#env.SVC#}}/parse'
      height: 169
      id: http_parse
      position:
        x: 360
        y: 282
      positionAbsolute:
        x: 360
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        type: code
        title: 提取骨架
        code_language: python3
        variables:
        - {variable: parse_body, value_selector: [http_parse, body]}
        code: |
          def main(parse_body: str) -> dict:
              import json
              doc_id, skeleton, pages = "", "{}", "[]"
              try:
                  pj = json.loads(parse_body)
                  doc_id = pj.get("doc_id", "")
                  sk = pj.get("skeleton", {})
                  skeleton = json.dumps(sk, ensure_ascii=False)
                  pages = json.dumps(
                      [{"slide_id": s["slide_id"], "role": s["role"]}
                       for s in sk.get("slides", [])], ensure_ascii=False)
              except Exception:
                  pass
              return {"doc_id": doc_id, "skeleton": skeleton, "pages": pages}
        outputs:
          doc_id: {type: string}
          skeleton: {type: string}
          pages: {type: string}
      id: code_extract
      position: {x: 600, y: 282}
      positionAbsolute: {x: 600, y: 282}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      height: 98
    - data:
        type: llm
        title: 大纲规划
        model:
          completion_params:
            temperature: 0.2
            thinking: false
          mode: chat
          name: qwen3.6-plus
          provider: wxj/bifrost/bifrost
        context: {enabled: false, variable_selector: []}
        vision: {enabled: false}
        prompt_template:
        - role: system
          text: |
            你是PPT结构规划师。根据用户需求和模板页面清单，规划要产出的每一页。
            只输出 JSON，含 outline 数组，不要解释、不要代码块包裹。
            规则：
            1. outline 每项 = {"use_slide_id":"<模板页slide_id>","role":"<该页role>","brief":"这页要写的内容要点"}。
            2. 不要改变页面顺序；正文等可重复页要几页就重复列几项（use_slide_id 相同）。
            3. role 取自页面清单里出现过的值（cover/toc/section/content/table/ending/generic）。
            4. brief 要具体、可直接据此写文案；正文每项 2-3 句、有数据感。
            输出示例：
            {"outline":[
              {"use_slide_id":"s1","role":"cover","brief":"主标题:2026产品发布；副标题:让服务快人一步"},
              {"use_slide_id":"s2","role":"toc","brief":"目录4项:背景/方案/数据/计划"},
              {"use_slide_id":"s5","role":"content","brief":"背景:市场规模..."},
              {"use_slide_id":"s5","role":"content","brief":"方案:三步走..."}
            ]}
        - role: user
          text: |
            模板页面清单（slide_id 与 role）：
            {{#code_extract.pages#}}

            用户需求：
            {{#start.user_brief#}}

            请只输出 outline 的 JSON。
      id: llm_a
      position: {x: 860, y: 282}
      positionAbsolute: {x: 860, y: 282}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      height: 98
    - data:
        type: code
        title: 合并大纲与骨架
        code_language: python3
        variables:
        - {variable: outline_text, value_selector: [llm_a, text]}
        - {variable: skeleton, value_selector: [code_extract, skeleton]}
        code: |
          def main(outline_text: str, skeleton: str) -> dict:
              import json, re
              outline = []
              m = re.search(r"\{.*\}", outline_text or "", re.S)
              if m:
                  try:
                      outline = json.loads(m.group(0)).get("outline", [])
                  except Exception:
                      outline = []
              slots_by_slide = {}
              try:
                  for s in json.loads(skeleton).get("slides", []):
                      slots_by_slide[s["slide_id"]] = [
                          sl for sl in s.get("slots", []) if sl.get("editable")]
              except Exception:
                  pass
              tasks = []
              for it in outline:
                  sid = it.get("use_slide_id")
                  if sid not in slots_by_slide:
                      continue
                  tasks.append({
                      "slide_id": sid,
                      "role": it.get("role", ""),
                      "brief": it.get("brief", ""),
                      "slots": slots_by_slide[sid],
                  })
              return {"tasks": json.dumps(tasks, ensure_ascii=False),
                      "count": len(tasks)}
        outputs:
          tasks: {type: string}
          count: {type: number}
      id: code_join
      position: {x: 1120, y: 282}
      positionAbsolute: {x: 1120, y: 282}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      height: 98
    - data:
        desc: 逐页调用 LLM 填充文案
        is_parallel: false
        iterator_selector:
        - code_join
        - tasks
        output_selector:
        - llm_page_fill
        - text
        output_type: array[string]
        selected: false
        start_node_id: llm_page_fill
        title: 逐页填充
        type: iteration
        nodes:
        - data:
            type: llm
            title: 页面填充LLM
            model:
              completion_params:
                temperature: 0.2
                thinking: false
              mode: chat
              name: qwen3.6-plus
              provider: wxj/bifrost/bifrost
            context: {enabled: false, variable_selector: []}
            vision: {enabled: false}
            prompt_template:
            - role: system
              text: |
                你是PPT文案填充器。把给定页面的每个文本槽填上最终文字。
                只输出 JSON：{"slide_id":"<本页slide_id>","fields":{"<shape_id>":"文本",...}}。
                不要解释、不要代码块包裹。
                规则：
                1. fields 的 key 只能用本页 slots 里给的 shape_id，不得编造、不得用别页的。
                2. 每个可编辑槽都要给出文本；页码/日期/装饰性固定文字保持其 current_text 原值。
                3. 内容依据 brief，贴合该页 role（封面写标题副标题、目录写条目、正文写要点）。
            - role: user
              text: |
                本页 slide_id：{{#iteration.item.slide_id#}}
                本页角色 role：{{#iteration.item.role#}}
                本页内容要点 brief：{{#iteration.item.brief#}}
                本页文本槽 slots（含 shape_id 与 current_text）：
                {{#iteration.item.slots#}}

                请只输出该页的 JSON。
          id: llm_page_fill
          position: {x: 50, y: 50}
          positionAbsolute: {x: 1430, y: 232}
          selected: false
          sourcePosition: right
          targetPosition: left
          type: custom
          width: 244
          height: 98
        edges: []
      id: iteration
      position: {x: 1380, y: 182}
      positionAbsolute: {x: 1380, y: 182}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      height: 198
    - data:
        type: code
        title: 组装Plan
        code_language: python3
        variables:
        - {variable: iter_outputs, value_selector: [iteration, output]}
        - {variable: skeleton, value_selector: [code_extract, skeleton]}
        code: |
          def main(iter_outputs: list, skeleton: str) -> dict:
              import json, re
              page_outputs = []
              for t in iter_outputs or []:
                  m = re.search(r"\{.*\}", t or "", re.S)
                  if not m:
                      continue
                  try:
                      o = json.loads(m.group(0))
                  except Exception:
                      continue
                  if o.get("slide_id") and isinstance(o.get("fields"), dict):
                      page_outputs.append({"slide_id": o["slide_id"],
                                           "fields": o["fields"]})
              sk = {}
              try:
                  sk = json.loads(skeleton)
              except Exception:
                  sk = {}
              # 内联 assemble_plan（与 app/assemble.py 等价）
              by_slide = {}
              for o in page_outputs:
                  by_slide.setdefault(o["slide_id"], []).append(o.get("fields") or {})
              plan = []
              for sl in sk.get("slides", []):
                  sid = sl.get("slide_id")
                  occs = by_slide.get(sid, [])
                  if not occs:
                      plan.append({"kind": "drop", "slide_id": sid})
                  elif len(occs) == 1:
                      plan.append({"kind": "fill", "slide_id": sid, "fields": occs[0]})
                  else:
                      plan.append({"kind": "repeat", "slide_id": sid, "items": occs})
              return {"plan_json": json.dumps(plan, ensure_ascii=False),
                      "valid": 1 if plan else 0}
        outputs:
          plan_json: {type: string}
          valid: {type: number}
      id: code_assemble
      position: {x: 1640, y: 282}
      positionAbsolute: {x: 1640, y: 282}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      height: 98
    - data:
        type: http-request
        title: 回写PPT(plan)
        method: post
        url: '{{#env.SVC#}}/apply_plan'
        authorization: {type: no-auth, config: null}
        headers: 'Content-Type:application/json'
        params: ''
        body:
          type: json
          data: '{"doc_id": "{{#code_extract.doc_id#}}", "plan": {{#code_assemble.plan_json#}}}'
        timeout: {max_connect_timeout: 0, max_read_timeout: 0, max_write_timeout: 0}
      id: http_apply_plan
      position: {x: 1900, y: 282}
      positionAbsolute: {x: 1900, y: 282}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      height: 169
    - data:
        desc: 返回 /apply_plan 的结果（含 download_url 与 rejected）
        outputs:
        - value_selector:
          - http_apply_plan
          - body
          variable: apply_result
        selected: false
        title: 结束
        type: end
      height: 98
      id: end
      position:
        x: 2160
        y: 282
      positionAbsolute:
        x: 2160
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 124.89999999999998
      y: 158.70000000000005
      zoom: 0.8
  rag_pipeline_variables: []
