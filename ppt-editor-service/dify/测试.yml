            # 输入说明

            - 原文：待修改的原始文本。

            - 审核结果：JSON 格式的审核意见，包含若干条问题及对应的修改建议（如错误位置、错误内容、修改建议等字段）。


            # 修改规则

            1. 严格依据审核结果进行修改，逐条落实，不得遗漏。

            2. 只修改审核结果中明确指出的问题，未提及的内容必须原样保留，禁止自行改写、增删或润色。

            3. 保持原文的整体结构、排版、段落顺序和语言风格不变。

            4. 若某条审核意见与原文不匹配（如定位不到对应内容），则跳过该条，不要强行修改。

            5. 若审核结果为空或未发现问题，则原样返回原文。


            # 输出要求

            - 只输出修改后的完整原文，禁止输出审核说明、修改对照、解释或任何多余文字。

