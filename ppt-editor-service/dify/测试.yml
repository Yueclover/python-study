    - data:
        code: "import json\ndef main(v0: str, user_query: str, history: str) -> dict:\n\
          \    reply = \"\"\"{v0}\"\"\"\n    reply = reply.format(v0=v0)\n    try:\n\
          \        arr = json.loads(history) if (history or '').strip() else []\n\
          \        if not isinstance(arr, list): arr = []\n    except Exception:\n\
          \        arr = []\n    arr.append({\"role\": \"user\", \"content\": user_query})\n\
          \    arr.append({\"role\": \"assistant\", \"content\": reply})\n    return\
          \ {\"messages_json\": json.dumps(arr, ensure_ascii=False)}\n"
