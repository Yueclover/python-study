app:
  description: 上传 PPT 模板 → LLM 生成编辑指令 → 回写新 pptx 下载
  icon: 📊
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: PPT模板LLM编辑
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: package
  value:
    plugin_unique_identifier: wxj/bifrost:0.1.5@b3a12d4350183a23b02da9cd95280287fa3459e6989d74b4330dbb11b0ef32cc
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: ''
    id: env-svc-0001
    name: SVC
    selector:
    - env
    - SVC
    value: http://172.16.40.114:8000
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - {id: e1, source: start, sourceHandle: source, target: http_parse, targetHandle: target, type: custom, data: {sourceType: start, targetType: http-request, isInIteration: false}}
    - {id: e2, source: http_parse, sourceHandle: source, target: code_extract, targetHandle: target, type: custom, data: {sourceType: http-request, targetType: code, isInIteration: false}}
    - {id: e3, source: code_extract, sourceHandle: source, target: llm_a, targetHandle: target, type: custom, data: {sourceType: code, targetType: llm, isInIteration: false}}
    - {id: e4, source: llm_a, sourceHandle: source, target: llm_b, targetHandle: target, type: custom, data: {sourceType: llm, targetType: llm, isInIteration: false}}
    - {id: e5, source: llm_b, sourceHandle: source, target: code_plan, targetHandle: target, type: custom, data: {sourceType: llm, targetType: code, isInIteration: false}}
    - {id: e6, source: code_plan, sourceHandle: source, target: http_apply_plan, targetHandle: target, type: custom, data: {sourceType: code, targetType: http-request, isInIteration: false}}
    - {id: e7, source: http_apply_plan, sourceHandle: source, target: end, targetHandle: target, type: custom, data: {sourceType: http-request, targetType: end, isInIteration: false}}
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - allowed_file_extensions:
          - .pptx
          allowed_file_types:
          - document
          allowed_file_upload_methods:
          - local_file
          - remote_url
          label: PPT模板
          options: []
          required: true
          type: file
          variable: file
        - label: 用户需求
          max_length: 2000
          options: []
          required: true
          type: paragraph
          variable: user_brief
      height: 116
      id: start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - file:
            - start
            - file
            id: parse-file-item
            key: file
            type: file
            value: ''
          type: form-data
        desc: POST /parse，上传 pptx 取结构化 JSON
        headers: ''
        method: post
        params: ''
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 100
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
        title: 解析PPT
        type: http-request
        url: '{{#env.SVC#}}/parse'
      height: 169
      id: http_parse
      position:
        x: 360
        y: 282
      positionAbsolute:
        x: 360
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        type: code
        title: 提取骨架
        code_language: python3
        variables:
        - {variable: parse_body, value_selector: [http_parse, body]}
        code: |
          def main(parse_body: str) -> dict:
              import json
              doc_id = ""
              skeleton = "{}"
              try:
                  pj = json.loads(parse_body)
                  doc_id = pj.get("doc_id", "")
                  skeleton = json.dumps(pj.get("skeleton", {}), ensure_ascii=False)
              except Exception:
                  pass
              return {"doc_id": doc_id, "skeleton": skeleton}
        outputs:
          doc_id: {type: string}
          skeleton: {type: string}
      id: code_extract
      position: {x: 600, y: 282}
      positionAbsolute: {x: 600, y: 282}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      height: 98
    - data:
        type: llm
        title: 生成内容
        model:
          completion_params:
            temperature: 0.2
            thinking: false
          mode: chat
          name: qwen3.6-plus
          provider: wxj/bifrost/bifrost
        context: {enabled: false, variable_selector: []}
        vision: {enabled: false}
        prompt_template:
        - role: system
          text: |
            你是资深PPT文案专家，只负责创作内容，不管排版、不输出任何 shape_id。
            只输出 JSON，包含 deck 数组，不要解释、不要代码块包裹。
            规则：
            1. deck 每项的 use 必须取自给定 skeleton 里出现过的页面 role（如 cover/content/table/generic）。
            2. 可重复页（如 content）用 {"use":"content","repeat":true,"items":[...]}，items 条数按用户需求来，内容要写满、具体、有数据感（每条 2-3 句）。
            3. 固定页用 {"use":"cover","title":"...","subtitle":"..."} 这类字段。
            4. 表格页用 {"use":"table","title":"...","table":{"headers":[...],"rows":[[...]]}}。
            输出示例：
            {"deck":[
              {"use":"cover","title":"2026 产品发布","subtitle":"让服务快人一步"},
              {"use":"content","repeat":true,"items":[
                {"title":"要点一","body":"具体内容……"},
                {"title":"要点二","body":"具体内容……"}
              ]},
              {"use":"table","title":"对比","table":{"headers":["指标","前","后"],"rows":[["响应","30s","3s"]]}}
            ]}
        - role: user
          text: |
            模板骨架（skeleton）：
            {{#code_extract.skeleton#}}

            用户需求：
            {{#start.user_brief#}}

            请只输出 deck 的 JSON。
      id: llm_a
      position: {x: 860, y: 282}
      positionAbsolute: {x: 860, y: 282}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      height: 98
    - data:
        type: llm
        title: 映射到plan
        model:
          completion_params:
            temperature: 0.2
            thinking: false
          mode: chat
          name: qwen3.6-plus
          provider: wxj/bifrost/bifrost
        context: {enabled: false, variable_selector: []}
        vision: {enabled: false}
        prompt_template:
        - role: system
          text: |
            你是映射器，只把"内容大纲"对到模板骨架的真实 shape_id，不改写内容、不创作。
            只输出 JSON，包含 plan 数组，不要解释、不要代码块包裹。
            规则：
            1. plan 每项的 kind 取 fill / repeat / table / drop 之一。
            2. fill: {"kind":"fill","slide_id":"<skeleton里的slide_id>","fields":{"<真实shape_id>":"文本"}}。
            3. repeat: {"kind":"repeat","slide_id":"<可重复页slide_id>","items":[{"<shape_id>":"文本",...}, ...]}，items 条数=内容大纲里该可重复页的 items 条数。
            4. table: {"kind":"table","shape_id":"<table槽的shape_id>","rows":[[...],[...]]}（含表头行）。
            5. drop: {"kind":"drop","slide_id":"<用不到的页>"}。
            6. fields/各item 的 key 必须是 skeleton 中真实存在的 shape_id，严禁编造。
            7. 不要生成临时ID、不要排 dup 顺序——服务端会处理。
            8. repeat 的 items 里每个 key 必须来自 slide_id 指定的那一页（同页的 shape_id），不要混用别的页的 shape_id。
            输出示例：
            {"plan":[
              {"kind":"fill","slide_id":"s1","fields":{"s1_sh1":"2026 产品发布","s1_sh2":"让服务快人一步"}},
              {"kind":"repeat","slide_id":"s2","items":[{"s2_sh1":"要点一","s2_sh2":"内容"},{"s2_sh1":"要点二","s2_sh2":"内容"}]},
              {"kind":"table","shape_id":"s3_sh4","rows":[["指标","前","后"],["响应","30s","3s"]]}
            ]}
        - role: user
          text: |
            模板骨架（skeleton）：
            {{#code_extract.skeleton#}}

            内容大纲：
            {{#llm_a.text#}}

            请只输出 plan 的 JSON。
      id: llm_b
      position: {x: 1120, y: 282}
      positionAbsolute: {x: 1120, y: 282}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      height: 98
    - data:
        type: code
        title: 提取plan
        code_language: python3
        variables:
        - {variable: llm_text, value_selector: [llm_b, text]}
        code: |
          def main(llm_text: str) -> dict:
              import json, re
              plan = []
              m = re.search(r"\{.*\}", llm_text or "", re.S)
              if m:
                  try:
                      plan = json.loads(m.group(0)).get("plan", [])
                  except Exception:
                      plan = []
              return {"plan_json": json.dumps(plan, ensure_ascii=False),
                      "valid": 1 if plan else 0}
        outputs:
          plan_json: {type: string}
          valid: {type: number}
      id: code_plan
      position: {x: 1380, y: 282}
      positionAbsolute: {x: 1380, y: 282}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      height: 98
    - data:
        type: http-request
        title: 回写PPT(plan)
        method: post
        url: '{{#env.SVC#}}/apply_plan'
        authorization: {type: no-auth, config: null}
        headers: 'Content-Type:application/json'
        params: ''
        body:
          type: json
          data: '{"doc_id": "{{#code_extract.doc_id#}}", "plan": {{#code_plan.plan_json#}}}'
        timeout: {max_connect_timeout: 0, max_read_timeout: 0, max_write_timeout: 0}
      id: http_apply_plan
      position: {x: 1640, y: 282}
      positionAbsolute: {x: 1640, y: 282}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      height: 169
    - data:
        desc: 返回 /apply_plan 的结果（含 download_url 与 rejected）
        outputs:
        - value_selector:
          - http_apply_plan
          - body
          variable: apply_result
        selected: false
        title: 结束
        type: end
      height: 98
      id: end
      position:
        x: 1900
        y: 282
      positionAbsolute:
        x: 1900
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 124.89999999999998
      y: 158.70000000000005
      zoom: 0.8
  rag_pipeline_variables: []
