          enabled: false
          variable_selector: []
        desc: ★ 先向用户输出一句"已收到写作要求与大纲，即将进行大纲优化"的提示语
        isInIteration: false
        isInLoop: false
        model:
          completion_params:
            temperature: 0.8
            thinking: false
          mode: chat
          name: qwen3.6-plus
          provider: wxj/bifrost/bifrost
        prompt_template:
        - id: sys_outline_notice
          role: system
          text: '你负责生成一句简短的过渡提示语，用于在正式优化大纲前告知用户。

            # 要求

            - 只输出这一句提示语本身，不要输出大纲、不要输出正文、不要任何解释或标题；

            - 语义需包含：已收到用户的写作要求和大纲内容、接下来将对大纲进行优化梳理；

            - 语气正式、专业、书面化，使用规范完整的句子，避免"啦""哦""这就""稍候哦"等口语化或语气助词，30-60 字，每次措辞可略有变化；

            - 可在结尾说明即将开始处理，例如"请稍候"。'
        - id: user_outline_notice
          role: user
          text: '【用户的写作要求 / 大纲】

            {{#sys.query#}}


            【参考文件（可能为空）】

            {{#1780385980077.output#}}


            请据此生成一句过渡提示语。'
