      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "def main(fill_text: str, skeleton: str, kept_ids: str) -> dict:\n \
          \   import json, re\n    page_outputs = []\n    m = re.search(r\"\\{.*\\\
          }\", fill_text or \"\", re.S)\n    if m:\n        try:\n            data\
          \ = json.loads(m.group(0))\n        except Exception:\n            data\
          \ = {}\n        for o in data.get(\"pages\", []):\n            if o.get(\"\
          slide_id\") and isinstance(o.get(\"fields\"), dict):\n                page_outputs.append({\"\
          slide_id\": o[\"slide_id\"],\n                                     \"fields\"\
          : o[\"fields\"]})\n    sk = {}\n    try:\n        sk = json.loads(skeleton)\n\
          \        if not isinstance(sk, dict):\n            sk = {\"slides\": []}\n\
          \    except Exception:\n        sk = {}\n    kept = set()\n    try:\n  \
          \      kept = set(json.loads(kept_ids or \"[]\"))\n    except Exception:\n\
          \        kept = set()\n    # 内联 assemble_plan（与 app/assemble.py 等价，含 kept_ids\
          \ 逻辑）\n    # 只统计 fields 非空的输出（空 fields 视为 no-op）\n    by_slide = {}\n  \
          \  for o in page_outputs:\n        fields = o.get(\"fields\") or {}\n  \
          \      if not fields:\n            continue\n        by_slide.setdefault(o[\"\
          slide_id\"], []).append(fields)\n    plan = []\n    for sl in sk.get(\"\
          slides\", []):\n        sid = sl.get(\"slide_id\")\n        occs = by_slide.get(sid,\
          \ [])\n        if not occs:\n            if sid in kept:\n             \
          \   # 大纲引用但无可填字段 → 原样保留，不发出任何 op\n                pass\n            else:\n\
          \                plan.append({\"kind\": \"drop\", \"slide_id\": sid})\n\
          \        elif len(occs) == 1:\n            plan.append({\"kind\": \"fill\"\
          , \"slide_id\": sid, \"fields\": occs[0]})\n        else:\n            #\
          \ N>1: reuse original for occs[0], duplicate only N-1 extras\n         \
          \   plan.append({\"kind\": \"repeat\", \"slide_id\": sid, \"items\": occs[1:]})\n\
          \            plan.append({\"kind\": \"fill\", \"slide_id\": sid, \"fields\"\
          : occs[0]})\n    return {\"plan_json\": json.dumps(plan, ensure_ascii=False),\n\
          \            \"valid\": 1 if plan else 0}\n"
        code_language: python3
        outputs:
          plan_json:
            type: string
          valid:
            type: number
        selected: false
        title: 组装Plan
