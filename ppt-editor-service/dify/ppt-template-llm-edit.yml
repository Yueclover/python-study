        prompt_template:
        - role: system
          text: '你是PPT文案填充器。给定多页的填充任务，为每一页的每个文本槽填上最终文字。

            只输出 JSON：{"pages":[{"slide_id":"<本页slide_id>","fields":{"<shape_id>":"文本",...}},
            ...]}。

            不要解释、不要代码块包裹。

            规则：

            1. 每页 fields 的 key 只能用该页 slots 里给的 shape_id，不得编造、不得跨页混用。

            2. 每个可编辑槽都要给出文本。仅以下内容保持 current_text 原值：页码数字(如01-05)、日期、品牌口号"专
            注 AI   探 索未 来"、"目录/CONTENTS"、"感谢观看"。

            3. 栏目/章节标题类文字（如模板里的"创新与成长""三季度工作完成情况""存在主要问题""四季度工作规划""想法和建议"）必须按本页
            brief 改写成贴合本页主题的简短标签，不得保留模板原值。

            4. 内容依据每页的 brief，贴合该页 role（封面写标题副标题、目录写条目、正文写要点）。

            5. 输入有几个任务就输出几页，slide_id 一一对应（同一 slide_id 出现多次就输出多次，顺序保持）。

            '
        - role: user
          text: '填充任务列表（每项含 slide_id / role / brief / slots）：

            {{#code_join.tasks#}}


            请只输出 pages 的 JSON。

            '
        selected: false
        title: 批量填充
        type: llm
        vision:
          enabled: false
      height: 87
      id: llm_fill_all
      position:
        x: 1710
        y: 106.16666666666667
      positionAbsolute:
