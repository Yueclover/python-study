            \ 的核心结构或亮点（每条一句，从 HTML 实际内容提炼，不要编造）。\n3. 结尾一句可执行的后续建议，引导用户下一步（如调整某页、补充数据、换配色等）。\n\
            \n# 严格规则\n- 只描述本次真实生成的内容，所有要点必须能在上面的 HTML 中找到依据，禁止虚构页数或主题。\n- 不要复述 HTML\
            \ 原文、不要输出任何标签或页码代码。\n- 语气自然、专业、口语化，总长度控制在 150–260 字。\n- 直接输出这段总结，不要任何前缀说明（如\"\
