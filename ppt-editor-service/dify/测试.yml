          \ def _ppt_from_history(h):\n        import json as _j, re as _re\n    \
          \    try:\n            arr = _j.loads(h) if (h or '').strip() else []\n\
          \        except Exception:\n            arr = []\n        if not isinstance(arr,\
          \ list):\n            return ''\n        for m in reversed(arr):\n     \
          \       if not isinstance(m, dict):\n                continue\n        \
          \    c = m.get('content', '')\n            if isinstance(c, str) and _re.search(r'<section\\\
          b', c, _re.DOTALL):\n                return c\n        return ''\n    ppt_html\
          \ = _ppt_from_history(history)\n    t=intent.strip()\n    if t.startswith(\"\
          ```\"):\n        t=t.strip(\"`\")\n        if t[:4]==\"json\": t=t[4:]\n\
          \        t=t.strip()\n    try: info=json.loads(t)\n    except Exception:\n\
          \        s=t.find(\"{\"); e=t.rfind(\"}\")\n        info=json.loads(t[s:e+1])\
          \ if s!=-1 and e!=-1 else {}\n    op=info.get(\"operation\",\"modify\")\n\
          \    pages=info.get(\"target_pages\") or []\n    inst=info.get(\"instruction\"\
          ,\"\")\n    pos=int(info.get(\"position\",0) or 0)\n    cnt=int(info.get(\"\
          count\",1) or 1)\n    secs=re.findall(r\"<section\\b.*?</section>\", ppt_html\
          \ or \"\", re.DOTALL)\n    if op in (\"modify\",\"delete\") and not pages:\n\
          \        return {\"operation\":op,\"instruction\":inst or \"无法定位目标页，请说明页码\"\
          ,\n                \"target_html\":\"\",\"full_html\":ppt_html or \"\",\"\
          position\":pos,\"count\":cnt,\n                \"target_pages\":json.dumps(pages),\"\
          need_clarify\":\"true\"}\n    picked=[]\n    for p in pages:\n        i=int(p)-1\n\
          \        if 0<=i<len(secs): picked.append(secs[i])\n    return {\"operation\"\
          :op,\"instruction\":inst,\n            \"target_html\":\"\\n\".join(picked),\"\
          full_html\":ppt_html or \"\",\n            \"position\":pos,\"count\":cnt,\"\
          target_pages\":json.dumps(pages),\n            \"need_clarify\":\"false\"\
          }\n"
